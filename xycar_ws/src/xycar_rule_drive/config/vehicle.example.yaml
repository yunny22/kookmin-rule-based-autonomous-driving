# Do not place measured vehicle values in the public repository.
#
# Copy this file to vehicle.local.yaml (ignored by git) and fill it from a
# vehicle-specific calibration procedure before any real-vehicle use. At a
# minimum, review wheel-base, command limits, steering-map commands/curvatures,
# speed commands, latency compensation, motor topic, and camera geometry.
#
# The public launcher starts with drive_enabled=false and does not load a local
# calibration automatically.

/**:
  ros__parameters:
    drive_enabled: false
